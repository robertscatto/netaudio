name: Android CI

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Executar o Build com Gradle Build Action
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: .
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }} # Opcional, o github ignora se vazio

    - name: Forçar Compilação do APK
      run: gradle assembleDebug

    - name: Salvar o APK gerado (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: meu-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
